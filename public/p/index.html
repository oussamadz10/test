<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demande de devis</title>
<meta name="description" content="Obtenez une estimation immédiate de vos travaux et envoyez votre demande de devis.">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css?v=5">
</head>
<body>
<header class="top"><div class="wrap"><div class="logo" id="brand"></div><div class="nav"><select class="lang" id="lang" aria-label="Langue"><option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option><option value="ar">AR</option></select><a class="btn btn-p btn-sm hidden" id="call"></a></div></div></header>
<main class="wrap narrow" style="padding:24px 16px 40px" id="root"><div class="empty"><span class="spin dk"></span></div></main>
<footer class="foot"><div class="wrap row between small"><div id="legal"></div><a href="/" target="_blank" rel="noopener">ChronoDevis</a></div></footer>
<script src="/assets/i18n.js?v=5"></script>
<script src="/assets/core.js?v=5"></script>
<script>
(function () {
  'use strict';
  const { T, el, eur, $ } = CD;
  const slug = (location.pathname.match(/\/p\/([a-z0-9-]+)/) || [])[1] || new URLSearchParams(location.search).get('slug');
  const root = $('#root');
  let P = null, est = null, lines = [], photos = null, desc = '', range = 'Standard', place = '';
  const lang = $('#lang');

  async function load() {
    try {
      const r = await fetch('/api/public-profile?slug=' + encodeURIComponent(slug || ''));
      if (!r.ok) throw new Error();
      P = await r.json();
    } catch (e) { root.innerHTML = ''; root.append(el('div', { class: 'empty', text: T('cp.notFound') })); return; }
    if (!new URLSearchParams(location.search).get('lang') && !localStorage.getItem('cdLang')) CD.setLang(P.lang || 'fr');
    CD.setLang(CD.lang); lang.value = CD.lang;
    document.documentElement.style.setProperty('--acc', P.accent_color || '#f97316');
    document.documentElement.style.setProperty('--acc2', P.accent_color || '#ea580c');
    document.title = T('cp.title') + ' – ' + P.company_name;
    const b = $('#brand'); b.innerHTML = '';
    if (P.logo_url) b.append(el('img', { src: P.logo_url, alt: '', style: 'width:auto;max-width:120px;border-radius:6px' }));
    b.append(el('span', { text: P.company_name }));
    if (P.phone) { const c = $('#call'); c.href = 'tel:' + P.phone.replace(/\s/g, ''); c.textContent = ''; c.append(CD.icon('phone'), P.phone); c.classList.remove('hidden'); }
    $('#legal').textContent = [P.company_name, P.siret ? 'SIRET ' + P.siret : '', P.city].filter(Boolean).join(' · ');
    form();
  }
  lang.onchange = () => { CD.setLang(lang.value); est ? showEstimate() : form(); };

  function form() {
    root.innerHTML = '';
    if (!P.active) { root.append(el('div', { class: 'card center' }, el('h2', { text: P.company_name }), el('p', { class: 'muted', text: T('cp.paused') }),
      P.phone ? el('a', { class: 'btn btn-p', href: 'tel:' + P.phone }, CD.icon('phone'), P.phone) : null, P.contact_email ? el('p', {}, el('a', { href: 'mailto:' + P.contact_email, text: P.contact_email })) : null)); return; }
    const d = el('textarea', { class: 'in', placeholder: T('cp.descPh') }); d.value = desc;
    const g = el('select', { class: 'in' }, el('option', { value: 'Standard', text: T('q.std') }), el('option', { value: 'Haut de gamme', text: T('q.premium') })); g.value = range;
    const site = el('input', { class: 'in', value: place, placeholder: T('cp.sitePh') });
    const box = el('div');
    const go = el('button', { class: 'btn btn-p btn-lg btn-block', text: T('cp.estimate') }), msg = el('div');
    root.append(el('div', { class: 'center', style: 'margin-bottom:18px' }, el('h1', { text: T('cp.h1') }),
      el('p', { class: 'muted', text: T('cp.sub', { company: P.company_name }) }),
      P.trades && P.trades.length ? el('div', { class: 'row', style: 'justify-content:center;gap:6px' }, P.trades.map((t) => el('span', { class: 'pill', text: T('trade.' + t) }))) : null),
      el('div', { class: 'card pad-lg' }, el('div', { class: 'field' }, el('label', { class: 'f', text: T('cp.desc') }), d),
        el('div', { class: 'grid g2' }, el('div', { class: 'field' }, el('label', { class: 'f', text: T('q.range') }), g), el('div', { class: 'field' }, el('label', { class: 'f', text: T('cp.site') }), site)),
        P.photos ? el('div', { class: 'field' }, el('label', { class: 'f', text: T('cp.photos') }), el('div', { class: 'hint', text: T('cp.photosHint') }), box) : null,
        msg, go));
    if (P.photos) { const prev = photos; photos = CD.photoPicker(box, 3); }
    go.onclick = async () => {
      msg.innerHTML = ''; desc = d.value.trim(); range = g.value; place = site.value.trim();
      const imgs = photos ? photos.get() : [];
      if (desc.length < 8 && !imgs.length) { msg.append(el('div', { class: 'alert err', text: T('err.describe') })); return; }
      go.disabled = true; go.innerHTML = '<span class="spin"></span> ' + T(imgs.length ? 'cp.analyzingPhotos' : 'analyzing');
      try {
        est = await CD.api('analyze-devis', { slug, description: desc, images: imgs, investment: range, site: place, lang: CD.lang });
        if (est.outOfScope) { msg.append(el('div', { class: 'alert info', text: est.message })); est = null; return; }
        est.photosCount = imgs.length;
        lines = CD.buildLines(est); showEstimate();
      } catch (e) { msg.append(el('div', { class: 'alert err', text: e.message })); }
      finally { go.disabled = false; go.textContent = T('cp.estimate'); }
    };
  }

  function showEstimate() {
    root.innerHTML = '';
    const t = CD.totals(lines, 0);
    const tb = el('table', { class: 'tbl' }, el('thead', {}, el('tr', {}, el('th', { text: T('q.label') }), el('th', { class: 'r', text: T('q.qty') }), el('th', { class: 'r', text: T('q.lineTotal') }))));
    lines.forEach((l) => tb.append(el('tr', {}, el('td', { text: l.label }), el('td', { class: 'r', text: l.qty + ' ' + l.unit }), el('td', { class: 'r', text: eur(l.qty * l.unitPrice) }))));
    const name = el('input', { class: 'in', autocomplete: 'name' }), email = el('input', { class: 'in', type: 'email', required: true, autocomplete: 'email' }),
      phone = el('input', { class: 'in', type: 'tel', autocomplete: 'tel' }), city = el('input', { class: 'in', value: place, autocomplete: 'postal-code' }),
      hp = el('input', { type: 'text', class: 'hidden', tabindex: '-1', autocomplete: 'off' }), ok = el('input', { type: 'checkbox', required: true });
    const send = el('button', { class: 'btn btn-p btn-lg btn-block', type: 'submit', text: T('cp.send') }), msg = el('div');
    const f = el('form', { class: 'card pad-lg', style: 'margin-top:16px', onsubmit: async (ev) => {
      ev.preventDefault(); msg.innerHTML = ''; send.disabled = true; send.innerHTML = '<span class="spin"></span>';
      try {
        await CD.api('request', { slug, name: name.value, email: email.value, phone: phone.value, city: city.value, website: hp.value, consent: ok.checked, description: desc, photosCount: est.photosCount,
          estimate: { title: est.title, summary: est.summary, totalHt: t.ht, hours: est.hours, lines, steps: est.steps, photoFindings: est.photoFindings, investment: range } });
        f.innerHTML = ''; f.append(el('div', { class: 'center' }, el('div', { class: 'done-ic' }, CD.icon('check')), el('h2', { text: T('cp.thanks') }), el('p', { class: 'muted', text: T('cp.thanksSub', { company: P.company_name }) }),
          el('button', { class: 'btn btn-l', type: 'button', text: T('cp.again'), onclick: () => { est = null; desc = ''; form(); } })));
      } catch (e) { msg.append(el('div', { class: 'alert err', text: e.message })); send.disabled = false; send.textContent = T('cp.send'); }
    } }, el('h3', { text: T('cp.formTitle') }), el('p', { class: 'muted small', text: T('cp.formSub', { company: P.company_name }) }), msg,
      el('div', { class: 'grid g2' }, el('div', { class: 'field' }, el('label', { class: 'f', text: T('f.name') }), name), el('div', { class: 'field' }, el('label', { class: 'f', text: T('f.email') + ' *' }), email),
        el('div', { class: 'field' }, el('label', { class: 'f', text: T('f.phone') }), phone), el('div', { class: 'field' }, el('label', { class: 'f', text: T('cp.site') }), city)), hp,
      el('label', { class: 'chk', style: 'margin-bottom:14px' }, ok, el('span', { text: T('cp.consent', { company: P.company_name }) })), send);
    root.append(el('div', { class: 'est-head' }, el('div', { class: 'k', text: T('cp.estTitle') }), el('h2', { text: est.title, style: 'margin:4px 0 0' })),
      el('div', { class: 'est-body' }, el('p', { class: 'muted', text: est.summary }),
        (est.photoFindings || []).length ? el('div', { class: 'alert info' }, el('b', { text: T('q.photoFindings') }), el('ul', { style: 'margin:6px 0 0' }, est.photoFindings.map((s) => el('li', { text: s })))) : null,
        el('div', { style: 'overflow-x:auto' }, tb),
        el('div', { class: 'sum-row tot' }, el('span', { text: T('cp.total') }), el('span', { text: eur(t.ht) })),
        P.vat_regime === 'franchise' ? el('div', { class: 'xs muted', text: T('vat.293b') }) : el('div', { class: 'xs muted', text: T('cp.vatNote') }),
        el('p', { class: 'xs muted', style: 'margin-top:10px', text: T('cp.disclaimer', { company: P.company_name }) }),
        el('button', { class: 'btn btn-g btn-sm', onclick: () => { est = null; form(); } }, CD.icon('back', 'flip'), T('cp.modify'))), f);
    scrollTo(0, 0);
  }
  if (!slug) { root.innerHTML = ''; root.append(el('div', { class: 'empty', text: T('cp.notFound') })); } else load();
})();
</script>
</body>
</html>
