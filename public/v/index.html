<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification de document – ChronoDevis</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css?v=7">
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="/"><img src="/icons/icon-192.png" alt="">Chrono<b>Devis</b></a><div class="nav"><select class="lang" id="lang" aria-label="Langue"><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option><option value="ar">العربية</option></select></div></div></header>
<main class="wrap narrow" style="padding:24px 16px 40px" id="root"><div class="empty"><span class="spin dk"></span></div></main>
<footer class="foot"><div class="wrap row between small"><a href="/legal.html">Mentions légales</a><a href="/">chronodevisia.fr</a></div></footer>
<script src="/assets/i18n.js?v=8"></script>
<script src="/assets/core.js?v=6"></script>
<script>
(function () {
  'use strict';
  const { T, el, eur, $ } = CD;
  const root = $('#root'), lang = $('#lang');
  const fromPath = (location.pathname.match(/\/v\/([A-Za-z0-9-]+)/) || [])[1] || new URLSearchParams(location.search).get('code') || '';
  const norm = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const fmtCode = (c) => c.length === 10 ? c.slice(0, 5) + '-' + c.slice(5) : c;
  const date = (d) => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
  lang.value = CD.lang;
  lang.onchange = () => { CD.setLang(lang.value); render(); };
  let data = null, code = norm(fromPath);

  function codeForm() {
    const inp = el('input', { class: 'in', value: fmtCode(code), placeholder: 'XXXXX-XXXXX', maxlength: 14, style: 'text-transform:uppercase;letter-spacing:.08em;font-weight:700' });
    return el('form', { class: 'row', style: 'gap:8px;flex-wrap:nowrap;margin-top:10px', onsubmit: (e) => { e.preventDefault(); code = norm(inp.value); history.replaceState(null, '', '/v/' + code); load(); } },
      inp, el('button', { class: 'btn btn-p', type: 'submit' }, CD.icon('search'), T('v.check')));
  }
  function reportForm() {
    const msg = el('textarea', { class: 'in', style: 'min-height:80px', required: true }), contact = el('input', { class: 'in' }), trap = el('input', { name: 'website', style: 'display:none', tabindex: '-1', autocomplete: 'off' });
    const btn = el('button', { class: 'btn btn-l', type: 'submit' }, T('v.send')), out = el('div');
    const det = el('details', { class: 'card', style: 'margin-top:16px' }, el('summary', { style: 'cursor:pointer;font-weight:700' }, T('v.report')),
      el('form', { style: 'margin-top:12px', onsubmit: async (e) => {
        e.preventDefault(); btn.disabled = true;
        try { await CD.api('report', { code, message: msg.value, contact: contact.value, website: trap.value }); det.lastChild.replaceWith(el('div', { class: 'alert ok', style: 'margin-top:12px', text: T('v.thanks') })); }
        catch (x) { out.innerHTML = ''; out.append(el('div', { class: 'alert err', text: x.message })); btn.disabled = false; }
      } }, el('div', { class: 'field' }, el('label', { class: 'f', text: T('v.reportMsg') }), msg), el('div', { class: 'field' }, el('label', { class: 'f', text: T('v.reportContact') }), contact), trap, out, btn));
    return det;
  }
  function render() {
    document.title = T('v.title') + ' – ChronoDevis';
    root.innerHTML = '';
    root.append(el('h1', { text: T('v.title') }), el('p', { class: 'muted', text: T('v.intro') }));
    const card = el('div', { class: 'card' }, el('label', { class: 'f', text: T('v.code') }), codeForm());
    root.append(card);
    if (!code) return;
    if (!data) { root.append(el('div', { class: 'empty' }, el('span', { class: 'spin dk' }))); return; }
    if (!data.found) { root.append(el('div', { class: 'vbox bad' }, el('h2', {}, CD.icon('x'), T('v.notFound').split('.')[0] + '.'), el('div', { text: T('v.notFound').split('.').slice(1).join('.').trim() })), reportForm()); return; }
    const q = data.quote, c = data.company;
    const level = !c.verified ? 'bad' : data.account === 'paid' ? 'ok' : 'warn';
    const note = !c.verified ? T('v.unverified') : data.account === 'trial' ? T('v.trial') : data.account === 'inactive' ? T('v.inactive') : T('v.verified');
    root.append(el('div', { class: 'vbox ' + level }, el('h2', {}, CD.icon(level === 'ok' ? 'check' : 'lock'), T('v.found')), el('div', { text: note })));
    const row = (k, v) => [el('dt', { text: k }), el('dd', {}, el('bdi', { text: v || '—' }))];
    root.append(el('div', { class: 'card' }, el('h3', { text: T('v.company') }), el('dl', { class: 'kv' },
        ...row(T('v.company'), c.name), ...(c.verified && c.officialName ? row('INSEE', c.officialName) : []), ...row('SIRET', c.siret), ...(c.city ? row('', c.city) : []))),
      el('div', { class: 'card', style: 'margin-top:16px' }, el('h3', { text: T('v.doc') }), el('dl', { class: 'kv' },
        ...row(T('v.number'), q.number), ...row(T('v.date'), date(q.createdAt)), ...row(T('v.updated'), date(q.updatedAt)), ...row(T('v.object'), q.title),
        ...row(T('v.client'), [q.client, q.city].filter(Boolean).join(' – ')), ...row(T('v.totalHt'), eur(q.totalHt)), ...row(T('v.total'), eur(q.totalTtc)), ...row(T('v.status'), T('status.' + (q.status || 'draft'))))),
      el('div', { class: 'alert info', style: 'margin-top:16px', text: T('v.compare') }), reportForm());
  }
  async function load() {
    data = null; render();
    if (!code) return;
    try { const r = await fetch('/api/verify?code=' + encodeURIComponent(code)); data = await r.json(); if (!r.ok && r.status !== 404) throw new Error(data.error); if (r.status === 404) data = { found: false }; }
    catch (e) { data = { found: false }; }
    render();
  }
  load();
})();
</script>
</body>
</html>
